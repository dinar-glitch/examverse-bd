<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exam Room | ExamVerse BD</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">ExamVerse <span>BD</span></div>
    <div id="timer">60:00</div>
</header>

<main class="exam-page">

    <div class="exam-header">
        <h2 id="examTitle">Examination</h2>
        <p id="questionProgress">Question 1 of 50</p>
    </div>

    <div class="exam-layout">

        <section class="question-area">

            <div class="question-card">

                <h3 id="questionText">
                    Question will appear here.
                </h3>

                <div id="optionsContainer"></div>

            </div>

            <div class="exam-controls">

                <button onclick="previousQuestion()">
                    Previous
                </button>

                <button onclick="markForReview()">
                    Mark for Review
                </button>

                <button onclick="nextQuestion()">
                    Next
                </button>

            </div>

        </section>

        <aside class="question-sidebar">

            <h3>Question Palette</h3>

            <div id="questionPalette"></div>

            <button class="submit-btn" onclick="submitExam()">
                Submit Examination
            </button>

        </aside>

    </div>

</main>

<script src="script.js"></script>

</body>
</html>
